<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Study render of an Arknights-style stage: perspective (or straight-on) view, with unit sprites placed on tiles.
import * as THREE from 'three';
import { buildArk } from './arkmap.js';

const levels = await (await fetch('./levels.json')).json();
const load = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = src; });

/** opts: { w, h, persp, pitch (deg), fov, units: [{ img, x, y, flip }] } */
window.render = async (id, opts = {}) => {
  const level = levels.find((l) => l.id === id);
  const pw = opts.w ?? 1600, ph = opts.h ?? 720;
  const persp = opts.persp !== false;
  const pitch = ((opts.pitch ?? (persp ? 57 : 46)) * Math.PI) / 180;
  const zScale = persp ? 1 : 1 / Math.sin(pitch);
  const { root, W, H, P, topOf, bounds: B } = buildArk(level, zScale);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(pw, ph);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(P.bg);

  const scene = new THREE.Scene();
  scene.add(root);
  scene.add(new THREE.HemisphereLight(P.sky[0], P.sky[1], 0.95));
  const cx = (B.x0 + B.x1) / 2, cz = ((B.y0 + B.y1) / 2) * zScale;
  const sun = new THREE.DirectionalLight(P.sun, 2.7);
  sun.position.set(cx - 8, 12, cz - 3);
  sun.target.position.set(cx, 0, cz);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const S = Math.max(W, H) * 0.8 + 4;
  Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 0.5, far: 60 });
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.03;
  sun.shadow.radius = 6;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x8fb4ff, 0.5);
  fill.position.set(cx + 8, 6, cz + 8);
  fill.target.position.set(cx, 0, cz);
  scene.add(fill, fill.target);

  let cam;
  const topBar = opts.top ?? 0.08, bottomBar = opts.bottom ?? 0.04;   // screen fractions kept clear for the HUD
  if (persp) {
    const fov = opts.fov ?? 30;
    cam = new THREE.PerspectiveCamera(fov, pw / ph, 0.5, 200);
    // distance: the nearest row (widest on screen) must fit the width, and all rows must fit the height
    const tanV = Math.tan((fov * Math.PI) / 360), tanH = tanV * (pw / ph);
    const target = new THREE.Vector3(cx, 0, cz + 0.25);
    let dist = 6;
    const fits = () => {
      cam.position.set(target.x, target.y + Math.sin(pitch) * dist, target.z + Math.cos(pitch) * dist);
      cam.lookAt(target);
      cam.updateMatrixWorld(true);
      cam.updateProjectionMatrix();
      for (const [x, z, y] of [[B.x0 - 0.25, B.y1 + 0.15, 0], [B.x1 + 0.25, B.y1 + 0.15, 0], [B.x0 - 0.25, B.y0, 1.0], [B.x1 + 0.25, B.y0, 1.0]]) {
        const v = new THREE.Vector3(x, y, z).project(cam);
        if (Math.abs(v.x) > 0.98 || v.y > 1 - topBar * 2 || v.y < -1 + bottomBar * 2) return false;
      }
      return true;
    };
    while (!fits() && dist < 80) dist += 0.25;
    scene.fog = new THREE.Fog(P.bg, dist * 0.95, dist * 1.9);
  } else {
    const view = Math.max((B.x1 - B.x0 + 0.6) / 2, ((B.y1 - B.y0 + 2.2) * (pw / ph)) / 2);
    cam = new THREE.OrthographicCamera(-view, view, view / (pw / ph), -view / (pw / ph), 0.1, 400);
    const dist = 150;
    cam.position.set(cx, Math.sin(pitch) * dist, cz + Math.cos(pitch) * dist + 0.4);
    cam.lookAt(cx, 0, cz + 0.4);
    cam.updateMatrixWorld(true);
  }
  renderer.render(scene, cam);

  const out = document.createElement('canvas');
  out.width = pw; out.height = ph;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);

  // glow pass
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  scene.fog = null;
  scene.traverse((o) => {
    if (!o.isMesh) return;
    const keep = (m) => (m.userData.glow ? m : black);
    const was = o.material;
    o.material = Array.isArray(was) ? was.map(keep) : keep(was);
    if (!Array.isArray(was) && o.material === black && was.transparent) o.visible = false;
  });
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(0x000000);
  renderer.render(scene, cam);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.filter = 'blur(7px)';
  g.globalAlpha = 0.9;
  g.drawImage(renderer.domElement, 0, 0);
  g.filter = 'blur(26px)';
  g.globalAlpha = 0.55;
  g.drawImage(renderer.domElement, 0, 0);
  g.restore();

  // vignette
  const vg = g.createRadialGradient(pw / 2, ph * 0.52, ph * 0.45, pw / 2, ph * 0.52, pw * 0.62);
  vg.addColorStop(0, 'rgba(4,6,12,0)');
  vg.addColorStop(1, 'rgba(4,6,12,0.72)');
  g.fillStyle = vg;
  g.fillRect(0, 0, pw, ph);

  // units: upright sprites standing on their tile, far rows first
  const px = (v) => [(v.x * 0.5 + 0.5) * pw, (-v.y * 0.5 + 0.5) * ph];
  const units = [...(opts.units ?? [])].sort((a, b) => a.y - b.y);
  for (const u of units) {
    const img = await load(u.img);
    const top = topOf(u.x, u.y);
    const zc = (u.y + 0.62) * zScale;
    const [fx, fy] = px(new THREE.Vector3(u.x + 0.5, top, zc).project(cam));
    const [ax] = px(new THREE.Vector3(u.x, top, zc).project(cam));
    const [bx] = px(new THREE.Vector3(u.x + 1, top, zc).project(cam));
    const tile = bx - ax;                          // tile width on screen at this depth
    const size = tile * 3 * (u.scale ?? 1);        // a sprite frame spans three tiles
    // soft shadow
    g.fillStyle = 'rgba(0,0,0,0.38)';
    g.filter = 'blur(3px)';
    g.beginPath();
    g.ellipse(fx, fy, tile * 0.3, tile * 0.11, 0, 0, 7);
    g.fill();
    g.filter = 'none';
    const feet = (img.height - 12 * (img.height / 192)) / img.height;
    g.save();
    g.translate(fx, fy);
    if (u.flip) g.scale(-1, 1);
    g.drawImage(img, -size / 2, -size * feet, size, size);
    g.restore();
    if (u.hp !== undefined) {
      const bw = tile * 0.62, by = fy + tile * 0.1;
      g.fillStyle = 'rgba(0,0,0,0.75)';
      g.fillRect(fx - bw / 2 - 1, by - 1, bw + 2, 7);
      g.fillStyle = u.enemy ? '#e0474f' : '#58d06a';
      g.fillRect(fx - bw / 2, by, bw * u.hp, 5);
    }
  }
  renderer.dispose();
  return out.toDataURL('image/png');
};
window.done = true;
</script></body></html>
