<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Renders one stage's map as a single background image aligned to the game's tile grid.
import * as THREE from 'three';
import { buildMap, PITCH, MARGIN, D } from './map3d.js';

const params = new URLSearchParams(location.search);
const PPU = +(params.get('ppu') || 64);   // image pixels per tile
const levels = await (await fetch('./levels.json')).json();

window.render = (id) => {
  const level = levels.find((l) => l.id === id);
  const built = buildMap(level);
  const { W, H } = built;
  const vw = W + MARGIN.l + MARGIN.r, vh = H + MARGIN.t + MARGIN.b;
  const pw = Math.round(vw * PPU), ph = Math.round(vh * PPU);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(pw, ph);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(built.bg);
  document.body.innerHTML = '';
  document.body.appendChild(renderer.domElement);
  built.lineMat.resolution.set(pw, ph);

  const scene = new THREE.Scene();
  scene.add(built.root);
  scene.add(new THREE.HemisphereLight(built.sky[0], built.sky[1], 1.35));
  const cx = W / 2, cz = (H / 2) * D;
  const sun = new THREE.DirectionalLight(0xffffff, 2.1);
  sun.position.set(cx + 6, 12, cz + 7);
  sun.target.position.set(cx, 0, cz);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const S = Math.max(W, H * D) * 0.9 + 6;
  Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 0.5, far: 60 });
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.02;
  sun.shadow.radius = 2;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x9fc8ff, 0.5);
  rim.position.set(-4, 3, -3);
  scene.add(rim);

  // Screen y of a ground point (row r) is -r; height lifts by cos(PITCH).
  const cam = new THREE.OrthographicCamera(-MARGIN.l, W + MARGIN.r, MARGIN.t, -(H + MARGIN.b), 0.1, 400);
  const dist = 150;
  cam.position.set(0, Math.sin(PITCH) * dist, Math.cos(PITCH) * dist);
  cam.up.set(0, Math.cos(PITCH), -Math.sin(PITCH));
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);

  // Darken the margins a little so the playable area reads at a glance.
  const out = document.createElement('canvas');
  out.width = pw; out.height = ph;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);
  const mx = MARGIN.l * PPU, my = MARGIN.t * PPU, mw = W * PPU, mh = H * PPU;
  g.fillStyle = 'rgba(8,8,14,0.38)';
  g.beginPath();
  g.rect(0, 0, pw, ph);
  g.rect(mx - 4, my - 4, mw + 8, mh + 8);
  g.fill('evenodd');
  renderer.dispose();
  return out.toDataURL('image/jpeg', +(params.get('q') || 0.86));
};
window.done = true;
</script></body></html>
