<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { build } from './models.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'brasa';
const W = +(params.get('w') || 520), H = +(params.get('h') || 620);
const yaw = +(params.get('yaw') || 0.55);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3440, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(2.5, 5, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3; sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -3;
sun.shadow.radius = 4;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x9fc8ff, 0.9);
rim.position.set(-4, 3, -3);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(1.1, 48), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const model = build(id);
model.rotation.y = yaw;
scene.add(model);
model.traverse((o) => { if (o.isMesh && !o.userData.outline) { o.castShadow = true; } });

const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const aspect = W / H;
const fit = Math.max(size.y * 1.12, (Math.max(size.x, size.z) / aspect) * 1.1, 2.1);
const dist = fit / (2 * Math.tan((camera.fov * Math.PI) / 360));
camera.position.set(center.x + dist * 0.05, center.y + dist * 0.22, center.z + dist);
camera.lookAt(center.x, center.y - size.y * 0.02, center.z);
renderer.render(scene, camera);
window.done = true;
</script></body></html>
