<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Second-generation stage backgrounds: lit materials, soft shadows, glow and a light colour grade.
import * as THREE from 'three';
import { buildMap, PITCH, MARGIN, D } from './map3d2.js';

const params = new URLSearchParams(location.search);
const PPU = +(params.get('ppu') || 128);   // image pixels per tile
const levels = await (await fetch('./levels.json')).json();

window.render = (id, type = 'image/jpeg') => {
  const level = levels.find((l) => l.id === id);
  const built = buildMap(level);
  const { W, H } = built;
  const vw = W + MARGIN.l + MARGIN.r, vh = H + MARGIN.t + MARGIN.b;
  const pw = Math.round(vw * PPU), ph = Math.round(vh * PPU);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(pw, ph);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.setClearColor(built.bg);

  const scene = new THREE.Scene();
  scene.add(built.root);
  scene.add(new THREE.HemisphereLight(built.sky[0], built.sky[1], 1.15));
  const cx = W / 2, cz = (H / 2) * D;
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
  sun.position.set(cx - 7, 13, cz + 6);
  sun.target.position.set(cx, 0, cz);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const S = Math.max(W, H * D) * 0.9 + 6;
  Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 0.5, far: 60 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.03;
  sun.shadow.radius = 5;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9fc0ff, 0.55);
  fill.position.set(cx + 6, 5, cz - 6);
  fill.target.position.set(cx, 0, cz);
  scene.add(fill, fill.target);

  // Screen y of a ground point (row r) is -r; height lifts by cos(PITCH).
  const cam = new THREE.OrthographicCamera(-MARGIN.l, W + MARGIN.r, MARGIN.t, -(H + MARGIN.b), 0.1, 400);
  const dist = 150;
  cam.position.set(0, Math.sin(PITCH) * dist, Math.cos(PITCH) * dist);
  cam.up.set(0, Math.cos(PITCH), -Math.sin(PITCH));
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);

  const out = document.createElement('canvas');
  out.width = pw; out.height = ph;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);

  // Glow: render only the light sources, blur them and add them back.
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const saved = [];
  scene.traverse((o) => {
    if (!o.isMesh) return;
    saved.push([o, o.material]);
    const keep = (m) => (m.userData.glow ? m : black);
    o.material = Array.isArray(o.material) ? o.material.map(keep) : keep(o.material);
    if (!Array.isArray(o.material) && o.material === black && saved[saved.length - 1][1].transparent) o.visible = false;
  });
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(0x000000);
  renderer.render(scene, cam);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.filter = `blur(${Math.round(PPU * 0.11)}px)`;
  g.globalAlpha = 0.9;
  g.drawImage(renderer.domElement, 0, 0);
  g.filter = `blur(${Math.round(PPU * 0.35)}px)`;
  g.globalAlpha = 0.5;
  g.drawImage(renderer.domElement, 0, 0);
  g.restore();

  // The scenery fades into a flat dark haze (HAZE) at the image border; the game paints the same colour
  // behind the image, so the map has no visible edge at any zoom.
  const mx = MARGIN.l * PPU, my = MARGIN.t * PPU, mw = W * PPU, mh = H * PPU;
  const mask = document.createElement('canvas');
  mask.width = pw; mask.height = ph;
  const mg = mask.getContext('2d');
  mg.fillStyle = 'rgb(8,10,18)';
  mg.fillRect(0, 0, pw, ph);
  mg.globalCompositeOperation = 'destination-out';
  mg.filter = `blur(${Math.round(PPU * 0.42)}px)`;
  mg.fillStyle = '#000';
  mg.fillRect(mx - PPU * 0.75, my - PPU * 0.55, mw + PPU * 1.5, mh + PPU * 1.75);
  g.drawImage(mask, 0, 0);
  renderer.dispose();
  return out.toDataURL(type, +(params.get('q') || 0.88));
};
window.done = true;
</script></body></html>
