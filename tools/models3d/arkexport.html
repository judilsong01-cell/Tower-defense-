<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Renders one stage as the game's battle background, seen through the perspective camera the game also uses to
// place units and read taps. The camera is described by a few numbers (see `view` below) saved next to the image.
import * as THREE from 'three';
import { buildArk } from './arkmap.js';

const params = new URLSearchParams(location.search);
const PPT = +(params.get('ppt') || 112);        // image pixels per tile at the centre of the stage
export const PITCH = (57 * Math.PI) / 180;
const levels = await (await fetch('./levels.json')).json();

window.render = (id) => {
  const level = levels.find((l) => l.id === id);
  const { root, W, H, P, bounds: B } = buildArk(level);
  const sin = Math.sin(PITCH), cos = Math.cos(PITCH);
  const cx = (B.x0 + B.x1) / 2, cz = (B.y0 + B.y1) / 2;
  const d = Math.max(12, 2.45 * (B.y1 - B.y0));
  const C = new THREE.Vector3(cx, d * sin, cz + d * cos);
  /** Camera-space tangents of a world point. */
  const tan = (X, Y, Z) => {
    const vx = X - C.x, vy = Y - C.y, vz = Z - C.z;
    const zc = -(vy * sin + vz * cos);
    return [vx / zc, (vy * cos - vz * sin) / zc];
  };
  // The frame: the playable tiles plus room for sprites at the back, the HUD and a border of scenery.
  let hw = 0, top = -1e9, bot = 1e9;
  for (const [X, Y, Z] of [[B.x0 - 1.3, 0, B.y1 + 1.0], [B.x1 + 1.3, 0, B.y1 + 1.0], [B.x0 - 1.3, 1.9, B.y0 - 0.6], [B.x1 + 1.3, 1.9, B.y0 - 0.6]]) {
    const [xt, yt] = tan(X, Y, Z);
    hw = Math.max(hw, Math.abs(xt));
    top = Math.max(top, yt);
    bot = Math.min(bot, yt);
  }
  const pw = Math.round(PPT * 2 * hw * d);
  const ph = Math.round((pw * (top - bot)) / (2 * hw));

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(pw, ph);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(P.bg);

  const scene = new THREE.Scene();
  scene.add(root);
  scene.fog = new THREE.Fog(P.bg, d * 1.2, d * 2.8);
  scene.add(new THREE.HemisphereLight(P.sky[0], P.sky[1], 0.95));
  const sun = new THREE.DirectionalLight(P.sun, 2.7);
  sun.position.set(cx - 8, 12, cz - 3);
  sun.target.position.set(cx, 0, cz);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  const S = Math.max(W, H) * 0.8 + 4;
  Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 0.5, far: 80 });
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.03;
  sun.shadow.radius = 6;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x8fb4ff, 0.5);
  fill.position.set(cx + 8, 6, cz + 8);
  fill.target.position.set(cx, 0, cz);
  scene.add(fill, fill.target);

  // Off-centre frustum that hugs the frame.
  const cam = new THREE.PerspectiveCamera(30, pw / ph, 0.5, 300);
  cam.position.copy(C);
  cam.lookAt(cx, 0, cz);
  cam.updateMatrixWorld(true);
  const near = 0.5, far = 300;
  cam.projectionMatrix.makePerspective(-hw * near, hw * near, top * near, bot * near, near, far);
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
  renderer.render(scene, cam);

  const out = document.createElement('canvas');
  out.width = pw; out.height = ph;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);

  // glow: light sources only, blurred and added back
  const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
  scene.fog = null;
  scene.traverse((o) => {
    if (!o.isMesh) return;
    const keep = (m) => (m.userData.glow ? m : black);
    const was = o.material;
    o.material = Array.isArray(was) ? was.map(keep) : keep(was);
    if (!Array.isArray(was) && o.material === black && was.transparent) o.visible = false;
  });
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(0x000000);
  renderer.render(scene, cam);
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.filter = `blur(${Math.round(PPT * 0.07)}px)`;
  g.globalAlpha = 0.9;
  g.drawImage(renderer.domElement, 0, 0);
  g.filter = `blur(${Math.round(PPT * 0.25)}px)`;
  g.globalAlpha = 0.5;
  g.drawImage(renderer.domElement, 0, 0);
  g.restore();

  // The border fades into the background colour, which the game paints behind the image.
  const mask = document.createElement('canvas');
  mask.width = pw; mask.height = ph;
  const mg = mask.getContext('2d');
  mg.fillStyle = P.bg;
  mg.fillRect(0, 0, pw, ph);
  mg.globalCompositeOperation = 'destination-out';
  mg.filter = `blur(${Math.round(PPT * 0.3)}px)`;
  mg.fillStyle = '#000';
  mg.fillRect(PPT * 0.55, PPT * 0.55, pw - PPT * 1.1, ph - PPT * 1.1);
  g.drawImage(mask, 0, 0);
  renderer.dispose();

  const r = (v) => Math.round(v * 1e5) / 1e5;
  return {
    url: out.toDataURL('image/jpeg', +(params.get('q') || 0.86)),
    view: { w: pw, h: ph, ppt: PPT, d: r(d), cx: r(cx), cz: r(cz), hw: r(hw), top: r(top), bot: r(bot), bg: P.bg },
  };
};
window.done = true;
</script></body></html>
